name: calendar-lab4

# Порти на хості на 1000 більші, ніж у ЛР3, тому лабораторні можуть працювати одночасно. Виняток — шлюз:
# 10088 замість 10080, бо 10080 входить до списку «bad ports» стандарту Fetch (Chrome, Node, MCP Inspector).

# Спільні налаштування мікросервісів: адреси інфраструктури всередині мережі Compose.
x-service: &service
  restart: unless-stopped
  networks: [calendar-net]

x-service-env: &service-env
  CONSUL_URL: http://consul:8500
  RABBITMQ_URL: amqp://calendar:calendar@rabbitmq:5672/

# Агенти ЛР4: один образ, роль задає команда. Ключ LLM та модель — у файлі .env (див. .env.example).
x-agent: &agent
  restart: unless-stopped
  networks: [calendar-net]
  image: calendar-lab4/agents:4.0
  pull_policy: never              # образ збирає сервіс mcp-server, решта агентів використовують його
  env_file:
    - path: .env
      required: false
  depends_on:
    consul: { condition: service_healthy }
    gateway: { condition: service_started }

x-agent-env: &agent-env
  CONSUL_URL: http://consul:8500
  GATEWAY_URL: http://gateway          # REST API ЛР3 через той самий шлюз, що й для зовнішніх клієнтів

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [calendar-net]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ---------- Інфраструктура ----------
  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0 -ui -log-level=warn
    ports: ["10500:8500"]
    networks: [calendar-net]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    image: traefik:v3.1
    command:
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.consulcatalog=true
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.exposedbydefault=false
      - --providers.consulcatalog.refreshinterval=3s
      - --accesslog=true
      - --accesslog.format=common
    ports:
      - "10088:80"     # єдина точка входу; не 10080: цей порт браузери і fetch блокують як unsafe port
      - "10081:8080"   # панель Traefik
    networks: [calendar-net]
    depends_on:
      consul: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: calendar
      RABBITMQ_DEFAULT_PASS: calendar
    ports: ["17672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [calendar-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Власні бази даних сервісів ----------
  calendar-db:
    <<: *db
    environment: { POSTGRES_DB: calendar, POSTGRES_USER: calendar, POSTGRES_PASSWORD: calendar }
    volumes: [calendar-db-data:/var/lib/postgresql/data]

  participation-db:
    <<: *db
    environment: { POSTGRES_DB: participation, POSTGRES_USER: participation, POSTGRES_PASSWORD: participation }
    volumes: [participation-db-data:/var/lib/postgresql/data]

  notification-db:
    <<: *db
    environment: { POSTGRES_DB: notification, POSTGRES_USER: notification, POSTGRES_PASSWORD: notification }
    volumes: [notification-db-data:/var/lib/postgresql/data]

  # ---------- Мікросервіси (порти назовні не відкриваються, доступ лише через шлюз) ----------
  calendar-service:
    <<: *service
    build: { context: ., dockerfile: services/calendar-service/Dockerfile }
    image: calendar-lab4/calendar-service:4.0
    environment:
      <<: *service-env
      SERVICE_NAME: calendar-service
      GATEWAY_PREFIX: /api/calendar
      SAGA_TIMEOUT_SECONDS: "30"     # дедлайн відповіді учасника SAGA
      DATABASE_URL: postgresql://calendar:calendar@calendar-db:5432/calendar
    depends_on:
      consul: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      calendar-db: { condition: service_healthy }

  participation-service:
    <<: *service
    build: { context: ., dockerfile: services/participation-service/Dockerfile }
    image: calendar-lab4/participation-service:4.0
    environment:
      <<: *service-env
      SERVICE_NAME: participation-service
      GATEWAY_PREFIX: /api/participation
      SLOW_CONSUMER_SECONDS: "45"    # затримка в режимі fault-mode=delay (більша за дедлайн SAGA)
      DATABASE_URL: postgresql://participation:participation@participation-db:5432/participation
    depends_on:
      consul: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      participation-db: { condition: service_healthy }

  notification-service:
    <<: *service
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    image: calendar-lab4/notification-service:4.0
    environment:
      <<: *service-env
      SERVICE_NAME: notification-service
      GATEWAY_PREFIX: /api/notification
      DATABASE_URL: postgresql://notification:notification@notification-db:5432/notification
    depends_on:
      consul: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      notification-db: { condition: service_healthy }

  # ---------- ЛР4: AI-інтеграція (MCP-сервер і A2A-агенти, теж за шлюзом) ----------
  mcp-server:
    <<: *agent
    build: { context: ., dockerfile: agents/Dockerfile }
    command: ["python", "-m", "calendar_ai.mcp_server", "http"]
    environment:
      <<: *agent-env
      MCP_RATE_LIMIT_PER_MINUTE: "60"

  producer-agent:
    <<: *agent
    command: ["uvicorn", "calendar_ai.producer_agent:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      <<: *agent-env
      AGENT_USER_ID: artem@pm.me     # організатор, від імені якого діє агент-продюсер
      # Ключі агентів-клієнтів (назва|користувач|ключ); навчальні значення, як і паролі БД у цьому файлі.
      A2A_CLIENT_KEYS: "organizer-console|artem@pm.me|dev-organizer-key,olena-assistant|olena@pm.me|dev-olena-assistant-key"

  consumer-agent:
    <<: *agent
    command: ["uvicorn", "calendar_ai.consumer_agent:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      <<: *agent-env
      RABBITMQ_URL: amqp://calendar:calendar@rabbitmq:5672/
      AGENT_USER_ID: olena@pm.me     # запрошена учасниця, асистентом якої є агент-споживач
      PRODUCER_AGENT_KEY: dev-olena-assistant-key
      A2A_CLIENT_KEYS: "olena-console|olena@pm.me|dev-olena-console-key"
    depends_on:
      consul: { condition: service_healthy }
      gateway: { condition: service_started }
      rabbitmq: { condition: service_healthy }

  # Консольні клієнти й перевірки: docker compose run --rm agent-cli <команда>
  agent-cli:
    <<: *agent
    profiles: ["cli"]
    restart: "no"
    command: ["python", "-m", "calendar_ai.fc_client", "--help"]
    environment:
      <<: *agent-env
      CONSUL_REGISTER: "0"
    volumes:
      - ./scripts:/srv/scripts:ro
      - ./docs/test-output:/srv/out

networks:
  calendar-net:

volumes:
  rabbitmq-data:
  calendar-db-data:
  participation-db-data:
  notification-db-data:
